font_family monospace
font_size 11.5
hide_window_decorations yes
confirm_os_window_close 0
window_padding_width 12
background #101014
foreground #E6E1E1
background_opacity 0.97
cursor #E45B62
cursor_text_color #101014
selection_background #8E1B24
selection_foreground #FFFFFF
active_border_color #C62828
inactive_border_color #30262B
tab_bar_style hidden
enable_audio_bell no
# Keep distinct ANSI colors for code and diagnostics.
color0 #28252B
color1 #E45B62
color2 #A6D189
color3 #E5C890
color4 #8CAAEE
color5 #CA9EE6
color6 #81C8BE
color7 #D5CED6
color8 #77717B
color9 #FF7B82
color10 #B6E199
color11 #F5D8A0
color12 #9CBAFE
color13 #DAAEF6
color14 #91D8CE
color15 #FFFFFF

# Keep the private shell runtime out of terminal child applications.
env LD_LIBRARY_PATH
env QT_PLUGIN_PATH
env QML_IMPORT_PATH
env QML2_IMPORT_PATH
